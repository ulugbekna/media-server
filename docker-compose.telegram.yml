# =============================================================================
# Telegram bot override for the media server stack.
#
# Adds Searcharr (https://github.com/toddrob99/searcharr), a Telegram bot
# that lets you search and add movies (Radarr) and TV shows (Sonarr) from
# your phone via chat messages like "/movie inception" or "/series severance".
#
# Usage:
#   1. Create a Telegram bot via @BotFather (see README "Telegram requests").
#   2. Put the bot token in .env as TELEGRAM_BOT_TOKEN=...
#   3. Run setup.ps1 -Telegram (Windows) or ./setup.sh --telegram (Linux/macOS).
#      The script will auto-generate Searcharr's settings.py using the API
#      keys it already extracts from Sonarr/Radarr.
#   4. In Telegram, message your bot:  /start <password>
#
# Searcharr initializes its Sonarr/Radarr clients only once at startup. Compose
# dependency ordering does not run when Docker auto-restarts containers after a
# host reboot, so a container-local gate checks the authenticated Arr APIs on
# every start before it launches Searcharr.
# =============================================================================

services:
  searcharr:
    # tag: toddrob/searcharr:latest
    # Pin to a specific digest (same supply-chain discipline as the rest of the stack).
    image: toddrob/searcharr@sha256:a00fd7e02ea6ef0d7c6181fcf7f33929db0d9bda9283f871937d72c0113b1f48
    container_name: searcharr
    entrypoint: ["python3", "/opt/searcharr-readiness/readiness.py"]
    command: ["--poll-seconds", "5", "--request-timeout-seconds", "3"]
    volumes:
      - ${CONFIG_ROOT}/searcharr/data:/app/data
      - ${CONFIG_ROOT}/searcharr/logs:/app/logs
      - ./searcharr_readiness/readiness.py:/opt/searcharr-readiness/readiness.py:ro
    environment:
      - TZ=${TZ:-UTC}
      - PYTHONDONTWRITEBYTECODE=1
    healthcheck:
      test: ["CMD", "python3", "/opt/searcharr-readiness/readiness.py", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped
    depends_on:
      sonarr:
        condition: service_healthy
      radarr:
        condition: service_healthy

  disk-guard:
    # Reuse Searcharr's pinned Python image; the guard itself uses stdlib only.
    # tag: toddrob/searcharr:latest
    image: toddrob/searcharr@sha256:a00fd7e02ea6ef0d7c6181fcf7f33929db0d9bda9283f871937d72c0113b1f48
    container_name: disk-guard
    entrypoint: ["python3", "/opt/disk-guard/guard.py"]
    command: ["--poll-seconds", "60"]
    environment:
      - TZ=${TZ:-UTC}
      - PYTHONDONTWRITEBYTECODE=1
      # Prefer gluetun when the VPN override is active; fall back to the
      # regular qBittorrent service for Telegram-only deployments.
      - DISK_GUARD_QBITTORRENT_URLS=${DISK_GUARD_QBITTORRENT_URLS:-http://gluetun:8080,http://qbittorrent:8080}
    volumes:
      - ${DATA_ROOT}:/data:ro
      - ${CONFIG_ROOT}/searcharr/data:/searcharr:ro
      - ${CONFIG_ROOT}/disk-guard:/state
      - ./disk_guard/guard.py:/opt/disk-guard/guard.py:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,nosuid,nodev,noexec
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python3", "/opt/disk-guard/guard.py", "--healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    depends_on:
      qbittorrent:
        condition: service_healthy
      searcharr:
        condition: service_healthy
