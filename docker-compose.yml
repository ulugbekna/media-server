# =============================================================================
# Home Media Server stack
#
# Brings up the *arr stack from the dev.to article in a single command:
#   - Prowlarr    (indexer proxy)       http://localhost:9696
#   - qBittorrent (torrent client)      http://localhost:8080
#   - Sonarr      (TV automation)       http://localhost:8989
#   - Radarr      (Movie automation)    http://localhost:7878
#   - Bazarr      (subtitle automation) http://localhost:6767
#   - Overseerr   (request UI)          http://localhost:5055
#
# (The dev.to article uses Jackett; we use Prowlarr — Jackett's modern
# successor from the same *arr family — because it auto-syncs indexers
# into Sonarr/Radarr instead of requiring per-app Torznab paste.)
#
# Plex is intentionally NOT included by default; the recommended install on
# Windows is the native Plex Media Server (better HW transcoding, easier
# discovery). A commented-out Plex service is provided below for users who
# prefer to run it in Docker.
#
# Disk layout — TRaSH "Hardlinks and Atomic Moves":
#   DATA_ROOT/                       (host path, e.g. D:/media-data)
#     ├── torrents/
#     │   ├── complete/    qBit's "Default Save Path"
#     │   └── incomplete/  qBit's "Keep incomplete torrents in"
#     └── media/
#         ├── tv/          Sonarr's Root Folder
#         └── movies/      Radarr's Root Folder
#
# Every service that touches files mounts DATA_ROOT as /data so that
# Sonarr/Radarr can hardlink from /data/torrents/complete/... to
# /data/media/{tv,movies}/... — instant import, 1× disk usage, qBit keeps
# seeding the original file. (Hardlinks require the source and destination
# to be on the same Linux mount point inside the container, which is why
# we use ONE bind mount per service instead of two.)
#
# Usage:
#   1. Copy .env.example to .env and edit the paths.
#   2. Run setup.ps1 (Windows) or setup.sh (Linux/macOS).
# =============================================================================

services:
  prowlarr:
    # tag: lscr.io/linuxserver/prowlarr:latest
    image: lscr.io/linuxserver/prowlarr@sha256:2489c6dbaf11e3a6d71aeb2e6980d04193d4af611aa7064a974851222fd41722
    container_name: prowlarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    volumes:
      - ${CONFIG_ROOT}/prowlarr:/config
    ports:
      # Bind to loopback — this admin UI should only be reachable from localhost.
      - "127.0.0.1:9696:9696"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9696/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ:-UTC}
    ports:
      - "127.0.0.1:8191:8191"
    healthcheck:
      # The flaresolverr image ships curl but not wget, so use curl here.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8191/ | grep -q FlareSolverr || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  qbittorrent:
    # tag: lscr.io/linuxserver/qbittorrent:latest
    image: lscr.io/linuxserver/qbittorrent@sha256:715d2bfbcf1cd3d734cbbd4fbd599eb7ea0642eaa079a372dd0d343f59516700
    container_name: qbittorrent
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    volumes:
      - ${CONFIG_ROOT}/qbittorrent:/config
      # Single bind mount under /data so Sonarr/Radarr can hardlink imports
      # to /data/media/{tv,movies}/... — see header comment.
      - ${DATA_ROOT}:/data
    ports:
      # Web UI — admin only, loopback only.
      - "127.0.0.1:8080:8080"
      # Torrent port — must be reachable from peers for seeding; bind to all interfaces.
      - "6881:6881"
      - "6881:6881/udp"
    healthcheck:
      # qBit's web UI returns 200 for / when running; a HEAD request is enough.
      test: ["CMD-SHELL", "curl -fsSI http://localhost:8080/ -o /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  sonarr:
    # tag: lscr.io/linuxserver/sonarr:latest
    image: lscr.io/linuxserver/sonarr@sha256:0b5c4803f92456fb9b65bae8375716ea120b4ea17b3cced7da32b63f0085782b
    container_name: sonarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    volumes:
      - ${CONFIG_ROOT}/sonarr:/config
      # Same single /data mount as qBittorrent so 'link(2)' across
      # /data/torrents/... -> /data/media/tv/... succeeds.
      - ${DATA_ROOT}:/data
    ports:
      - "127.0.0.1:8989:8989"
    # Make 'host.docker.internal' reach the host kernel's gateway so the
    # Plex notifier (wired by setup.ps1 / setup.sh bootstrap) can talk to a
    # natively-installed Plex Media Server on the same machine. Docker
    # Desktop on Win/Mac sets this automatically; on Linux engine it doesn't
    # unless we ask for it.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8989/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    restart: unless-stopped
    depends_on:
      prowlarr:
        condition: service_healthy
      qbittorrent:
        condition: service_healthy

  radarr:
    # tag: lscr.io/linuxserver/radarr:latest
    image: lscr.io/linuxserver/radarr@sha256:c0a4335d4249b46102f64cf6fa27ffc3bddfd9138fac1e4ddf238afd37f02d1f
    container_name: radarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    volumes:
      - ${CONFIG_ROOT}/radarr:/config
      - ${DATA_ROOT}:/data
    ports:
      - "127.0.0.1:7878:7878"
    # See sonarr above — same reason for host.docker.internal mapping.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7878/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    restart: unless-stopped
    depends_on:
      prowlarr:
        condition: service_healthy
      qbittorrent:
        condition: service_healthy

  overseerr:
    # tag: sctx/overseerr:latest
    image: sctx/overseerr@sha256:6197516c9d7b58ccf113455e32aafb94df5d91995fe50e8c2cae6ba6c7c7b7de
    container_name: overseerr
    # Run as non-root to avoid root writes to the config volume.
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ:-UTC}
    volumes:
      - ${CONFIG_ROOT}/overseerr:/app/config
    ports:
      # Overseerr is intentionally bound to all interfaces so LAN devices
      # (phones, other computers) can submit requests without SSH tunnelling.
      # Enable Overseerr's built-in authentication (Settings → Users) and
      # consider putting it behind a reverse proxy for HTTPS.
      - "5055:5055"
    healthcheck:
      # /api/v1/status returns version info publicly without auth.
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5055/api/v1/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    depends_on:
      sonarr:
        condition: service_healthy
      radarr:
        condition: service_healthy

  bazarr:
    # Subtitle automation — auto-fetches subtitles for everything Sonarr/Radarr
    # downloads. Mounts the same /data as Sonarr/Radarr so subtitle files
    # land next to the video files they describe.
    # tag: lscr.io/linuxserver/bazarr:latest
    image: lscr.io/linuxserver/bazarr@sha256:4b5e510042bf471c8bafab89cada9774fba2fb25f16ec64235151cacbe847c10
    container_name: bazarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
    volumes:
      - ${CONFIG_ROOT}/bazarr:/config
      - ${DATA_ROOT}:/data
    ports:
      - "127.0.0.1:6767:6767"
    healthcheck:
      # Bazarr's API requires a key; probe the root which returns 200/302.
      test: ["CMD-SHELL", "curl -fsSI http://localhost:6767/ -o /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    restart: unless-stopped
    depends_on:
      sonarr:
        condition: service_healthy
      radarr:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Plex (optional — uncomment to run in Docker instead of natively)
  # ---------------------------------------------------------------------------
  # plex:
  #   image: lscr.io/linuxserver/plex:latest
  #   container_name: plex
  #   network_mode: host  # required for Plex auto-discovery (Linux/macOS)
  #   environment:
  #     - PUID=${PUID:-1000}
  #     - PGID=${PGID:-1000}
  #     - TZ=${TZ:-UTC}
  #     - VERSION=docker
  #     # Get a claim token from https://plex.tv/claim (valid for 4 minutes)
  #     - PLEX_CLAIM=
  #   volumes:
  #     - ${CONFIG_ROOT}/plex:/config
  #     # Point Plex at /data/media/{tv,movies} inside the container.
  #     - ${DATA_ROOT}:/data
  #   restart: unless-stopped
